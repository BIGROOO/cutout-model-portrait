name: Publish model
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Download and verify original model
        run: |
          mkdir -p site/models
          cp LICENSE site/LICENSE
          curl --fail --location --retry 5 --output site/models/birefnet-portrait.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/BiRefNet-portrait-epoch_150.onnx
          echo 'c3a64a6abf20250d090cd055f12a3b67  site/models/birefnet-portrait.onnx' | md5sum --check
          sha256sum site/models/birefnet-portrait.onnx | tee site/model.sha256
          echo '<h1>Cutout BiRefNet portrait model</h1><a href="https://bigrooo.github.io/cutout-web/">Open Cutout</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
